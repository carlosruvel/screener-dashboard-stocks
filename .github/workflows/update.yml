name: Actualizar screener diario

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el screener
        run: python screener.py

      - name: Guardar data.json actualizado
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json screener_resultados_completos.csv
          git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios que subir"
          git push

      - name: Preparar publicación en Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: actualizar-datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
